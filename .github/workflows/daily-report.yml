name: Daily Game Intelligence Report

on:
  schedule:
    # 北京时间早上 08:30、08:47、09:08、09:27、09:17 多轮兜底
    - cron: "30 8 * * *"
      timezone: "Asia/Shanghai"
    - cron: "47 8 * * *"
      timezone: "Asia/Shanghai"
    - cron: "8 9 * * *"
      timezone: "Asia/Shanghai"
    - cron: "27 9 * * *"
      timezone: "Asia/Shanghai"
    - cron: "17 9 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:
    inputs:
      force:
        description: "Force rebuild even if today's report already exists"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-game-intelligence-report
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set container timezone
        run: sudo timedatectl set-timezone Asia/Shanghai

      # ---------------- 下面你原来所有的抓取、生成、提交步骤不动 ----------------
