name: Daily Game Intelligence Report

on:
  schedule:
    # GitHub cron 是UTC！
    # UTC 01:30 = 北京时间 09:30
    # UTC 01:47 = 北京时间 09:47
    # UTC 02:08 = 北京时间 10:08
    # UTC 02:27 = 北京时间 10:27
    # UTC 03:17 = 北京时间 11:17
    - cron: "30 1 * * *"
    - cron: "47 1 * * *"
    - cron: "8 2 * * *"
    - cron: "27 2 * * *"
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force rebuild even if today's report already exists"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-game-intelligence-report
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pandas

      - name: Run report generate script
        env:
          TZ: Asia/Shanghai
          FORCE: ${{ github.event.inputs.force }}
        run: |
          python fetch_report.py

      - name: Commit and push generated report
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --quiet; then
            echo "✅ 今日报表已存在，无新文件，跳过提交"
          else
            git commit -m "🤖 Auto update game report $(date +%Y-%m-%d %H:%M:%S)"
            git push
          fi
