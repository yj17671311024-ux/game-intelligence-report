name: Daily Game Intelligence Report

on:
  schedule:
    # 北京时间 早上 08:30、08:47、09:08、09:27、09:17 多轮兜底（Asia/Shanghai）
    - cron: "30 8 * * *"
      timezone: "Asia/Shanghai"
    - cron: "47 8 * * *"
      timezone: "Asia/Shanghai"
    - cron: "8 9 * * *"
      timezone: "Asia/Shanghai"
    - cron: "27 9 * * *"
      timezone: "Asia/Shanghai"
    - cron: "17 9 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:
    inputs:
      force:
        description: "Force rebuild even if today's report already exists"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-game-intelligence-report
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai  # 脚本环境时区，抓取榜单、生成日报日期=北京时间
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # 系统时区加固（双重保险）
      - name: Set container timezone
        run: sudo timedatectl set-timezone Asia/Shanghai

      # ========== 下面是你原来剩下的步骤，保持不动 ==========
      # - name: ...你原来的脚本、抓取、生成、提交代码全部放这里
