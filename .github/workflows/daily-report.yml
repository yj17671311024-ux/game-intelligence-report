name: Daily Game Intelligence Report

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-game-intelligence-report
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build daily report
        shell: bash
        run: |
          REPORT_DATE="$(TZ=Asia/Shanghai date +'%Y-%m-%d')"
          mkdir -p .generated
          OUTPUT_DIR="$GITHUB_WORKSPACE/.generated" SITE_DIR="$GITHUB_WORKSPACE" node scripts/build-daily-report.js "$REPORT_DATE"
          echo "REPORT_DATE=$REPORT_DATE" >> "$GITHUB_ENV"

      - name: Commit and push report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html README.md archive assets/icons/official scripts/build-daily-report.js .github/workflows/daily-report.yml
          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "daily report: $REPORT_DATE"
            git push
          fi
